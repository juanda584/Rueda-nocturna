<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
     <link href="./dist/output.css" rel="stylesheet">
</head>
<body>
 <div class="max-w-md bg-white rounded-2xl p-6 shadow-xl">
    
  <span class="inline-block bg-emerald-100 text-medellin-accent text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">
    Nuevo · Jueves a sábado
  </span>
  
  <h1 class="font-display text-2xl font-extrabold text-slate-900 mt-3">
    Rueda Nocturna
  </h1>
  
  <h2 class="text-slate-600 mt-1 text-sm md:text-base">
    Descubre Medellín en bici cuando se encienden las luces
  </h2>
  
  <div class="flex gap-6 mt-6">
    <div> 
      <p class="text-xl font-extrabold text-slate-900">

        <span class="text-red-500">3</span> Rutas
      </p>
      <p class="text-xs text-slate-500 font-medium">Disponibles</p>
    </div>
    
    <div>
      <p class="text-xl font-extrabold text-slate-900"> Desde   <span class="text-red-500">55.000</span></p>
      <p class="text-xs text-slate-500 font-medium">Por persona</p>
    </div>
  </div>
  <div class="mt-6 pt-6 border-t border-slate-100 space-y-4">
    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Variantes de Botón:</p>

    <!-- VARIANTE 1: Principal (Bordes redondeados normales + Sombra con color intensa) -->
    <button class="block w-full text-center bg-medellin-neon text-white py-3 rounded-xl font-bold text-sm transition hover:bg-opacity-90 shadow-lg shadow-purple-500/30 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2">
      Botón Principal
    </button>

    <!-- VARIANTE 2: Secundario (Bordes SÚPER redondos tipo píldora + Sombra suave) -->
    <button class="block w-full text-center bg-slate-900 text-white py-3 rounded-full font-bold text-sm transition hover:bg-slate-800 shadow-md shadow-slate-900/10 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:ring-offset-2">
      Botón Secundario
    </button>

    <!-- VARIANTE 3: Alerta (Bordes más rectos/básicos + Sin sombra inicial, pero gana sombra al Hover) -->
    <button class="block w-full text-center bg-rose-50 text-rose-600 py-3 rounded-md font-bold text-sm border border-rose-100 transition hover:bg-rose-100 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2">
      Botón Alerta
    </button>
  </div>

  <a href="#" class="block w-full text-center bg-medellin-neon text-white py-3 rounded-xl font-bold mt-6 shadow-lg shadow-purple-500/20 hover:bg-opacity-90 transition">
    Inscríbete
  </a>



</html>
